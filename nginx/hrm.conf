# HRM internal hosting (Path B-slim).
# Scheme: public internet -> Tailscale Funnel https://<tailnet-name>.ts.net
#   /            -> ticketing app (existing funnel, 127.0.0.1:80, untouched)
#   /hrm/        -> this server block (SPA static build, base /hrm/)
#   /hrm/api/    -> internal-api.js on 127.0.0.1:3001 (prefix stripped, upstream sees /api/...)
#   /hrm/rest/* + /hrm/auth/* -> Kong on 127.0.0.1:8000 (full path kept, Kong strips /hrm)
# Enable with: tailscale serve --set-path=/hrm http://127.0.0.1:8080
#   (Funnel must already be ON for the tailnet host.)
server {
  listen 8080;
  server_name _;

  client_max_body_size 50m;

  # --- Supabase-compatible API (PostgREST / GoTrue via Kong) ---
  location ~ ^/hrm/(rest|auth)/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # --- App backend (/api/* handlers) ---
  location ^~ /hrm/api/ {
    rewrite ^/hrm(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # --- SPA static build (vite build --base=/hrm/) ---
  location ^~ /hrm/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /hrm/index.html;
  }
}
